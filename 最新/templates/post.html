<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>補充支援</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            height: 100vh;
            overflow: hidden;
            background-color: #fefefe;
        }

        /* 中央配置 */
        .content-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 20px;
        }

        /* 中央固定コンテナ（幅を固定し中央に寄せる） */
        .main-center-container {
            width: 80%;
            max-width: 900px;
        }

        /* 履歴枠 */
        .history-box {
            height: 60vh;
            background: #ffffff;
            border: 1px solid #ccc;
            border-radius: 10px;
            overflow-y: auto;
            padding: 15px 15px 60px;
            position: relative;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .history-table img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 5px;
        }

        /* Excel ボタンを枠の右下に固定 */
        .excel-btn {
            position: absolute;
            bottom: 15px;
            right: 15px;
        }
    </style>
</head>

<body class="d-flex flex-column">

    <!-- ヘッダー -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #ADD8E6;">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">
                    <i class="bi bi-map"></i> 補充支援
                </a>
            </div>
        </nav>
    </header>

    <div class="content-wrapper">
        <div class="main-center-container">
            <div class="history-box">
                <h5 class="mb-3">補充履歴一覧</h5>

                <table class="table table-bordered history-table align-middle">
                    <thead class="table-light">
                        <tr>
                            <th style="width: 70px;">画像</th>
                            <th>商品名</th>
                            <th>補充数</th>
                            <th>補充自販機名</th>
                            <th>日付</th>
                            <th style="width: 90px;">削除</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>

                <button class="btn btn-success excel-btn">
                    <i class="bi bi-file-earmark-excel"></i> Excelに出力
                </button>

            </div>
        </div>
    </div>

    <!-- フッター -->
    <footer class="text-light text-end px-3 py-2" style="background-color: #ADD8E6;">
        文教大学 情報学部 情報システム学科 プロジェクト演習BC
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="{{ url_for('static', filename='js/post.js') }}"></script>
</body>

</html>
