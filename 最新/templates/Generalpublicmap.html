<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>地図システム</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/leaflet-extra-markers/1.2.1/css/leaflet.extra-markers.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    #map {
      height: 100vh;
      z-index: 1;
    }

    .menu-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 1000;
      /* 地図より前面に */
    }

    .search-bar {
      position: absolute;
      top: 15px;
      left: 70px;
      /* ← ハンバーガーの右側に配置 */
      width: 250px;
      z-index: 1000;
      border-radius: 8px;
      padding-left: 10px;
    }

    #menu .offcanvas-bottom-btn {
      position: absolute;
      bottom: 20px;
      /* 下からの距離 */
      right: 20px;
      /* 右からの距離 */
      z-index: 10;
    }

    .modal-header,
    .modal-footer {
      border: none !important;
    }
  </style>
</head>

<body>
  <div id="map"></div>
  <!--ボタン類-->
  <button class="btn btn-dark menu-btn" data-bs-toggle="offcanvas" data-bs-target="#menu">
    ☰
  </button>

  <input type="text" id="addressInput" class="form-control search-bar" placeholder="住所を検索（Enter）">
  <!--ここまでボタン類-->
  <!-- メニュー本体（Offcanvas） -->
  <div class="offcanvas offcanvas-start" tabindex="-1" id="menu">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title">メニュー</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <p>ここに項目を追加できます。</p>
      <ul>
        <li><a href="{{ url_for('login') }}">ホーム</a></li>
        <li>ルート検索</li>
        <li>設定</li>
      </ul>
    </div>
  </div>
  <!-- ここまでメニュー本体（Offcanvas） -->
  <!-- マーカー詳細表示パネル（閲覧専用） -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="markerDetailPanel">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title">マーカー詳細</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>

    <div class="offcanvas-body">
      <form id="markerForm">

        <!-- マーカー名（閲覧専用） -->
        <div class="mb-3">
          <label for="markerName" class="form-label">マーカー名</label>
          <input type="text" class="form-control" id="markerName" readonly>
        </div>

        <!-- 登録日時（閲覧専用） -->
        <div class="mb-3">
          <label for="markerDate" class="form-label">登録日時</label>
          <input type="datetime-local" class="form-control" id="markerDate" readonly>
        </div>

        <!-- 写真（アップロード不可 → 表示のみ） -->
        <div class="mb-3">
          <label class="form-label">写真</label>
          <img id="markerPhoto" src="" class="img-fluid rounded border" alt="登録写真" style="max-height: 250px;">
        </div>

      </form>
    </div>
  </div>

  <!-- ここまでマーカー詳細登録パネル -->
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!--ExtraMarkers の CDN -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-extra-markers/1.2.1/js/leaflet.extra-markers.min.js"></script>
  <!-- turf.js -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

  <!-- 外部JS -->
  <script src="{{ url_for('static', filename='js/Generalpublicmap.js') }}"></script>
</body>

</html>
