<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>補充支援</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    .left-area {
      background-color: #ffffff;
    }

    .login-box {
      max-width: 350px;
      width: 100%;
    }

    .menu-box {
      max-width: 300px;
      width: 100%;
    }
  </style>
</head>

<body class="d-flex flex-column">

  <!-- ヘッダー -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #add8e6">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">
          <i class="bi bi-map"></i> 補充支援
        </a>
      </div>
    </nav>
  </header>

  <!-- メイン -->
  <div class="container-fluid flex-grow-1">
    <div class="row h-100 justify-content-center align-items-center gap-5">

      <!-- ✅ 左側（中央寄り） -->
      <div class="col-md-4 left-area d-flex justify-content-center">

        <div class="menu-box text-center">

          <h4 class="mb-4 text-dark">メニュー</h4>

          <div class="d-grid gap-3">
            <button class="btn btn-light btn-lg" onclick="location.href='Generalpublicmap.html'">
              <i class="bi bi-map"></i> 自販機を探す
            </button>

            <button class="btn btn-light btn-lg">
              <i class="bi bi-bar-chart"></i> 仮設置
            </button>

            <button class="btn btn-light btn-lg">
              <i class="bi bi-info-circle"></i> システム説明
            </button>
          </div>

        </div>

      </div>

      <!-- ✅ 右側（中央寄り） -->
      <div class="col-md-4 d-flex justify-content-center">

        <div class="login-box">

          <h3 class="text-center mb-4">ログインフォーム</h3>

          <form action="/login" method="POST">

            <div class="mb-3">
              <label class="form-label">ユーザー名</label>
              <input type="text" class="form-control" name="login_id" required>
            </div>

            <div class="mb-3">
              <label class="form-label">パスワード</label>
              <input type="password" class="form-control" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
              ログイン
            </button>

            {% if error %}
            <div class="mt-3 text-danger text-center">
              {{ error }}
            </div>
            {% endif %}

          </form>

        </div>

      </div>

    </div>
  </div>

  <!-- フッター -->
  <footer class="text-light text-end px-3 py-2" style="background-color: #add8e6;">
    文教大学 情報学部 情報システム学科 プロジェクト演習BC
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
