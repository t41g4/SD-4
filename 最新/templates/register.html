<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー登録</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex flex-column">

    <div class="content-wrapper">
        <div class="main-center-container">
            <div class="history-box">
                <h5 class="mb-3">補充履歴一覧</h5>

                <table class="table table-bordered history-table align-middle">
                    <thead class="table-light">
                        <tr>
                            <th style="width: 70px;">画像</th>
                            <th>商品名</th>
                            <th>補充数</th>
                            <th>補充自販機名</th>
                            <th>日付</th>
                            <th style="width: 90px;">削除</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>

                <button class="btn btn-success excel-btn">
                    <i class="bi bi-file-earmark-excel"></i> Excelに出力
                </button>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="{{ url_for('static', filename='js/post.js') }}"></script>

</body>

</html>
