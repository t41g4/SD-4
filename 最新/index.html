<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>神奈川県ルート管理（住所検索・レスポンシブ）</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --sidebar-width: 380px;
      --topbar-height: 64px;
      --touch-btn: 44px;
    }
    html,body { height:100%; margin:0; }
    body { font-family: system-ui, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; -webkit-font-smoothing:antialiased; }
    /* Topbar */
    #topbar{
      position:fixed; top:0; left:0; right:0; height:var(--topbar-height);
      background:#fff; border-bottom:1px solid #eee; display:flex; align-items:center; gap:8px;
      padding:8px 12px; z-index:1400; box-sizing:border-box;
    }
    .btn { padding:8px 10px; min-height:var(--touch-btn); border-radius:8px; border:1px solid #ccc; background:#fff; cursor:pointer; }
    .btn:active{ transform:translateY(1px); }
    #main { position:fixed; top:var(--topbar-height); left:0; right:var(--sidebar-width); bottom:0; }
    #map { width:100%; height:100%; }
    /* Sidebar on right */
    #sidebar {
      position:fixed; top:var(--topbar-height); right:0; width:var(--sidebar-width); bottom:0;
      background:#fff; border-left:1px solid #eee; display:flex; flex-direction:column; z-index:1300; box-sizing:border-box;
    }
    .section-title { padding:8px; font-weight:700; border-bottom:1px solid #eee; }
    #slot-list { padding:8px; display:flex; flex-direction:column; gap:8px; max-height:180px; overflow:auto; }
    .slot-row { display:flex; align-items:center; gap:8px; padding:6px; border-radius:8px; background:#fafafa; }
    .slot-badge { font-size:12px; padding:2px 8px; border-radius:12px; color:#fff; margin-left:auto; }
    #saved-pins { padding:8px; border-top:1px solid #eee; border-bottom:1px solid #eee; }
    #saved-pins-list { max-height:160px; overflow:auto; display:flex; flex-direction:column; gap:6px; }
    .saved-pin-row { display:flex; gap:8px; align-items:center; }
    #directions { padding:8px; overflow:auto; flex:1; }
    .dir-step { padding:8px; border-radius:8px; margin-bottom:6px; background:#fff; border:1px solid #eee; cursor:pointer; }
    input[type="text"], select { padding:8px; border:1px solid #ddd; border-radius:8px; }
    /* Search results dropdown */
    #search-results { position:absolute; top:calc(var(--topbar-height) + 48px); left:12px; z-index:1500; background:#fff; border:1px solid #ddd; border-radius:6px; max-height:300px; overflow:auto; width:320px; }
    .search-item { padding:8px; cursor:pointer; border-bottom:1px solid #f1f1f1; }
    .search-item:hover { background:#f5f7ff; }
    /* responsive: mobile: sidebar becomes bottom sheet */
    @media (max-width:900px){
      :root { --sidebar-width: 100%; --topbar-height: 56px; }
      #main { right:0; height:55vh; top:var(--topbar-height); }
      #sidebar { top:calc(var(--topbar-height) + 55vh); left:0; right:0; bottom:0; width:100%; border-left:none; border-top:1px solid #eee; }
      #search-results{ left:12px; width: calc(100% - 24px); top:calc(var(--topbar-height) + 48px); }
    }
  </style>
</head>
<body>
  <!-- Topbar with controls + search -->
  <div id="topbar">
    <button id="btn-clear" class="btn">マーカーをクリア</button>
    <button id="btn-draw" class="btn">経路を描画</button>
    <button id="btn-save" class="btn">ルートを保存</button>
    <button id="btn-load" class="btn">保存ルートを読み込み</button>

    <label style="margin-left:8px;">保存スロット</label>
    <select id="route-slot" style="padding:8px; border-radius:8px;">
      <option value="0">Slot 1</option><option value="1">Slot 2</option><option value="2">Slot 3</option><option value="3">Slot 4</option><option value="4">Slot 5</option>
      <option value="5">Slot 6</option><option value="6">Slot 7</option><option value="7">Slot 8</option><option value="8">Slot 9</option><option value="9">Slot 10</option>
    </select>
    <button id="btn-overwrite" class="btn">上書き確認で保存</button>

    <!-- Address search -->
    <div style="margin-left:12px;">
      <input id="addr-search" type="text" placeholder="住所を検索（例：藤沢市 湘南台）" style="width:320px;"/>
    </div>

    <div style="margin-left:auto; color:#666;" id="status">神奈川県内のみピン追加可（設定可）</div>
  </div>

  <!-- Search results (absolute) -->
  <div id="search-results" style="display:none;"></div>

  <!-- Main map area -->
  <div id="main"><div id="map"></div></div>

  <!-- Sidebar (right / bottom on mobile) -->
  <div id="sidebar">
    <div class="section-title">保存スロット</div>
    <div id="slot-list"></div>

    <div class="section-title" style="margin-top:6px;">保存ピン一覧（編集可）</div>
    <div id="saved-pins">
      <div id="saved-pins-list"></div>
      <div style="margin-top:8px; display:flex; gap:8px;">
        <button id="btn-show-selected-route" class="btn">選択ピンでルート表示</button>
        <button id="btn-clear-selection" class="btn">選択クリア</button>
      </div>
    </div>

    <div class="section-title">道順（ルート）</div>
    <div id="directions">
      <div id="dir-summary" style="font-weight:700; margin-bottom:8px;">経路情報はここに表示されます</div>
      <div id="dir-steps"></div>
    </div>
  </div>

  <!-- libs -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>

  <script>
/* ====== JS: 神奈川県範囲 + 住所検索 + レスポンシブ操作 ====== */

    // Kanagawa prefecture bbox (approximate) - adjust if you need precise boundary
    const KANAGAWA_BBOX = { minLat:34.9920, minLng:139.0120, maxLat:35.6510, maxLng:139.8000 };
    const kanagawaBounds = L.latLngBounds([KANAGAWA_BBOX.minLat, KANAGAWA_BBOX.minLng],[KANAGAWA_BBOX.maxLat, KANAGAWA_BBOX.maxLng]);

    const map = L.map('map', {
      center: kanagawaBounds.getCenter(),
      zoom: 11,
      maxBounds: kanagawaBounds.pad(0.05),
      maxBoundsViscosity: 1.0
    });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors' }).addTo(map);

    // state
    let markers = [];           // editing markers on map
    let markerPositions = [];
    let polyline = null;
    let arrowsLayer = L.layerGroup().addTo(map);
    let highlightMarker = null;
    let slotLoaded = {};        // current loaded slot entry
    let savedPinObjects = [];   // pins for currently displayed slot
    const slotColors = ['#2a6fdb','#2dbf6f','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#f97316','#10b981','#ef3bff','#64748b'];

    // DOM refs
    const slotListEl = document.getElementById('slot-list');
    const savedPinsListEl = document.getElementById('saved-pins-list');
    const statusEl = document.getElementById('status');
    const dirStepsEl = document.getElementById('dir-steps');
    const dirSummaryEl = document.getElementById('dir-summary');
    const searchInput = document.getElementById('addr-search');
    const searchResultsEl = document.getElementById('search-results');

    function setStatus(msg){ statusEl.textContent = msg; }

    function isInsideKanagawa(latlng){
      return latlng.lat >= KANAGAWA_BBOX.minLat && latlng.lat <= KANAGAWA_BBOX.maxLat &&
             latlng.lng >= KANAGAWA_BBOX.minLng && latlng.lng <= KANAGAWA_BBOX.maxLng;
    }
    function clampToKanagawa(latlng){
      const lat = Math.max(KANAGAWA_BBOX.minLat, Math.min(KANAGAWA_BBOX.maxLat, latlng.lat));
      const lng = Math.max(KANAGAWA_BBOX.minLng, Math.min(KANAGAWA_BBOX.maxLng, latlng.lng));
      return L.latLng(lat,lng);
    }

    /* --- marker editing & saving --- */
    function addMarker(latlng, options = {}) {
      if(!isInsideKanagawa(latlng)) { setStatus('神奈川県外のため追加できません'); return null; }
      const m = L.marker(latlng, { draggable:true }).addTo(map);
      if(options.title) m.bindTooltip(options.title, {permanent:false, direction:'top'});
      m.on('dragend', () => {
        const p = m.getLatLng();
        if(!isInsideKanagawa(p)){ m.setLatLng(clampToKanagawa(p)); setStatus('範囲外→神奈川県内に戻しました'); }
        syncPositionsFromMarkers();
        updatePolyline();
      });
      markers.push(m);
      markerPositions.push({lat: latlng.lat, lng: latlng.lng});
      updatePolyline();
      setStatus('編集マーカー数: ' + markers.length);
      return m;
    }
    function syncPositionsFromMarkers(){ markerPositions = markers.map(m=>{ const p=m.getLatLng(); return {lat:p.lat, lng:p.lng}; }); }
    function clearMarkers(){ clearArrows(); clearDirectionsPanel(); if(polyline){ map.removeLayer(polyline); polyline=null; } markers.forEach(m=>map.removeLayer(m)); markers=[]; markerPositions=[]; setStatus('編集マーカーをクリア'); }
    function updatePolyline(){ syncPositionsFromMarkers(); if(polyline) map.removeLayer(polyline); if(markerPositions.length>=2){ polyline = L.polyline(markerPositions.map(p=>[p.lat,p.lng]), {weight:4}).addTo(map); map.fitBounds(polyline.getBounds().pad(0.06)); } }

    /* --- OSRM routing --- */
    async function fetchRouteByCoords(coordsStr){
      const url = 'https://router.project-osrm.org/route/v1/driving/' + coordsStr + '?overview=full&geometries=geojson&steps=true';
      const res = await fetch(url);
      if(!res.ok) throw new Error('HTTP '+res.status);
      return await res.json();
    }

    async function drawRouting(){
      if(markers.length < 2){ setStatus('編集ピンを2つ以上置いてください'); return; }
      const coords = markers.map(m=>{ const p=m.getLatLng(); return p.lng + ',' + p.lat; }).join(';');
      try{
        setStatus('ルート取得中...');
        const data = await fetchRouteByCoords(coords);
        if(!data.routes || data.routes.length === 0){ setStatus('ルートが見つかりません'); return; }
        const route = data.routes[0];
        if(polyline) { map.removeLayer(polyline); polyline = null; }
        clearArrows(); clearDirectionsPanel();
        polyline = L.geoJSON(route.geometry, { style:{ color:'#2b8cff', weight:6, opacity:0.9 } }).addTo(map);
        map.fitBounds(polyline.getBounds().pad(0.1));
        addArrowsToRoute(route.geometry, 10);
        renderDirectionsPanel(route);
        setStatus('ルート描画完了');
      }catch(e){ setStatus('OSRMエラー: ' + e.message); console.error(e); }
    }

    /* arrows along line (turf) */
    function clearArrows(){ arrowsLayer.clearLayers(); }
    function addArrowsToRoute(lineGeoJSON, interval_m = 10){
      arrowsLayer.clearLayers();
      try{
        const line = turf.lineString(lineGeoJSON.coordinates);
        const length_km = turf.length(line, {units:'kilometers'});
        if(length_km <= 0) return;
        const step_km = interval_m / 1000;
        for(let dist = step_km; dist < length_km; dist += step_km){
          const pt = turf.along(line, dist, {units:'kilometers'});
          const ahead = turf.along(line, Math.min(dist + Math.min(0.0005, step_km), length_km), {units:'kilometers'});
          let bearing = turf.bearing(pt, ahead); if(isNaN(bearing)) bearing = 0;
          const [lng, lat] = pt.geometry.coordinates;
          const s = 14;
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${s}" height="${s}" viewBox="0 0 24 24"><g transform="translate(12,12) rotate(${bearing}) translate(-12,-12)"><path d="M12 2 L16 10 L12 8 L8 10 Z" fill="#0066cc" stroke="#003366" stroke-width="0.35"/></g></svg>`;
          const icon = L.divIcon({ html: svg, className:'route-arrow-icon', iconSize:[s,s], iconAnchor:[s/2,s/2] });
          const mk = L.marker([lat, lng], { icon: icon, interactive: false });
          arrowsLayer.addLayer(mk);
        }
      }catch(e){ console.error('addArrowsToRoute', e); }
    }

    /* directions panel rendering */
    function clearDirectionsPanel(){ dirStepsEl.innerHTML = ''; dirSummaryEl.textContent = '経路情報はここに表示されます'; if(highlightMarker){ map.removeLayer(highlightMarker); highlightMarker = null; } }
    function formatStepInstruction(step){
      const m = step.maneuver || {}; const type = m.type || ''; const mod = m.modifier || ''; const road = step.name || ''; const dist_m = Math.round(step.distance || 0);
      let action = '';
      if(type === 'depart') action = '出発';
      else if(type === 'arrive') action = '到着';
      else if(type === 'turn'){ if(mod === 'left') action = '左折'; else if(mod === 'right') action = '右折'; else action = '方向転換'; }
      else if(type === 'roundabout') action = 'ラウンドアバウト'; else if(type === 'merge') action = '合流'; else if(type === 'continue') action = '直進';
      else action = type || '進む';
      let s = action; if(road) s += ' → ' + road; s += ' （約 ' + dist_m + ' m）'; return s;
    }
    function renderDirectionsPanel(route){
      try{
        console.log('renderDirectionsPanel called, legs:', route.legs ? route.legs.length : 0);
        clearDirectionsPanel();
        dirSummaryEl.textContent = `所要 約 ${Math.round(route.duration/60)} 分 / ${(route.distance/1000).toFixed(2)} km`;
        let stepIndex = 0;
        const legs = route.legs || [];
        for(let li=0; li<legs.length; li++){
          const leg = legs[li];
          const legDiv = document.createElement('div'); legDiv.style.marginBottom = '8px';
          const legHeader = document.createElement('div'); legHeader.style.fontWeight = '700'; legHeader.style.marginBottom = '6px';
          legHeader.textContent = `区間 ${li+1} — ${(leg.distance/1000).toFixed(2)} km / 約 ${Math.round(leg.duration/60)} 分`;
          legDiv.appendChild(legHeader);
          const steps = leg.steps || [];
          for(let si=0; si<steps.length; si++){
            const step = steps[si]; stepIndex++;
            const stepDiv = document.createElement('div'); stepDiv.className = 'dir-step';
            const title = document.createElement('div'); title.style.fontWeight='600'; title.textContent = stepIndex + '. ' + formatStepInstruction(step);
            const sub = document.createElement('div'); sub.style.fontSize='13px'; sub.style.color='#555';
            const man = step.maneuver || {};
            sub.textContent = `操作: ${man.type || '-'} ${man.modifier || ''} （位置: ${man.location ? man.location[1].toFixed(6)+', '+man.location[0].toFixed(6) : '不明'}）`;
            stepDiv.appendChild(title); stepDiv.appendChild(sub);
            (function(s){ stepDiv.addEventListener('click', ()=>{ if(highlightMarker){ map.removeLayer(highlightMarker); highlightMarker=null; } if(s.maneuver && s.maneuver.location){ const [lng,lat] = s.maneuver.location; highlightMarker = L.circleMarker([lat, lng], { radius:8, color:'#ff6600', weight:2, fillOpacity:0.9 }).addTo(map); map.panTo([lat, lng]); setTimeout(()=>{ if(highlightMarker){ map.removeLayer(highlightMarker); highlightMarker=null; } }, 5000); } }); })(step);
            legDiv.appendChild(stepDiv);
          }
          dirStepsEl.appendChild(legDiv);
        }
      }catch(e){ console.error('renderDirectionsPanel error', e); }
    }

    /* --- Slots & saved pins UI (same as before, single-slot radio with overwrite button) --- */
    async function refreshSlotList(){
      try{
        const res = await fetch('/list_routes'); if(!res.ok) return;
        const data = await res.json();
        slotListEl.innerHTML = '';
        for(let i=0;i<10;i++){
          const key = 'slot-' + i;
          const info = data[key];
          const row = document.createElement('div'); row.className='slot-row';
          const rb = document.createElement('input'); rb.type='radio'; rb.name='route-slot-radio'; rb.value=key; rb.dataset.slot=key;
          rb.checked = !!slotLoaded[key];
          rb.addEventListener('change', async (e)=>{ if(e.target.checked){ for(const s in Object.assign({}, slotLoaded)){ if(s!==key) unloadSlot(s); } await loadAndShowSlot(key); } });
          const label = document.createElement('div'); label.textContent = 'Slot ' + (i+1);
          const badge = document.createElement('div'); badge.className = 'slot-badge'; badge.style.background = slotColors[i % slotColors.length];
          badge.textContent = info && info.exists ? (info.created_at || '保存済') : '空';
          const overwriteBtn = document.createElement('button'); overwriteBtn.className='btn'; overwriteBtn.textContent='上書き保存';
          overwriteBtn.addEventListener('click', async (ev)=>{ ev.stopPropagation(); if(!confirm('スロット '+(i+1)+' を画面のピンで上書き保存しますか？')) return; const slotName='slot-'+i; const points = savedPinObjects.filter(s=>s.slot===slotName).map(s=>({lat:s.lat,lng:s.lng})); const names = savedPinObjects.filter(s=>s.slot===slotName).map(s=>s.name||''); try{ const r2 = await fetch('/save_route',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ name:slotName, points: points, names: names }) }); const j=await r2.json(); if(r2.ok){ setStatus(slotName+' を上書き保存しました'); await refreshSlotList(); } else { setStatus('保存失敗: '+(j.error||r2.statusText)); } }catch(err){ setStatus('送信エラー: '+err.message); } });
          row.appendChild(rb); row.appendChild(label); row.appendChild(badge); row.appendChild(overwriteBtn);
          slotListEl.appendChild(row);
        }
      }catch(e){ console.error('refreshSlotList error', e); }
    }

    /* load slot and show pins */
    async function loadAndShowSlot(slotName){
      try{
        if(slotLoaded[slotName]){ setStatus(slotName+' は既に読み込まれています'); return; }
        const res = await fetch('/load_route?name=' + encodeURIComponent(slotName));
        if(!res.ok){ setStatus('ロード失敗: '+res.status); return; }
        const data = await res.json();
        if(!data.points || data.points.length === 0){ setStatus(slotName + ' は空です'); slotLoaded[slotName] = { points: [], color: slotColors[Number(slotName.split('-')[1]) % slotColors.length], markers: [] }; renderCombinedSavedPinsUI(); return; }
        const idx = Number(slotName.split('-')[1]); const color = slotColors[idx % slotColors.length];
        for(const s in Object.assign({}, slotLoaded)){ if(s !== slotName) unloadSlot(s); }
        slotLoaded[slotName] = { points: data.points, color: color, markers: [] };
        const names = Array.isArray(data.names) ? data.names : null;
        const selectOnLoad = true;
        savedPinObjects = [];
        data.points.forEach((p,i)=>{ const defaultName = names && names[i] ? names[i] : `Pin ${i+1}`; const sp={slot:slotName, idx:i, lat:p.lat, lng:p.lng, selected:selectOnLoad, name:defaultName, marker:null}; const fill = sp.selected ? color : '#999'; const iconHtml = `<svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 2 C9 7 6 9 6 13 A6 6 0 0 0 18 13 C18 9 15 7 12 2 Z" fill="${fill}"/></svg>`; const icon = L.divIcon({ html: iconHtml, className:'', iconSize:[18,18], iconAnchor:[9,18] }); const mk = L.marker([p.lat,p.lng], { icon: icon }).addTo(map); mk.on('click', ()=>{ sp.selected = !sp.selected; updateSavedPinMarker(sp); }); sp.marker = mk; savedPinObjects.push(sp); slotLoaded[slotName].markers.push(mk); });
        renderCombinedSavedPinsUI();
        setStatus(slotName + ' を読み込みました（単一）');
      }catch(e){ setStatus('slot読み込みエラー: '+e.message); console.error(e); }
    }

    function unloadSlot(slotName){
      if(!slotLoaded[slotName]) return;
      if(slotLoaded[slotName].markers && slotLoaded[slotName].markers.length) slotLoaded[slotName].markers.forEach(m=>{ if(m) map.removeLayer(m); });
      savedPinObjects = savedPinObjects.filter(o=>o.slot !== slotName);
      delete slotLoaded[slotName];
      renderCombinedSavedPinsUI();
      setStatus(slotName + ' を非表示にしました');
    }

    function renderCombinedSavedPinsUI(){
      savedPinsListEl.innerHTML = '';
      const sorted = savedPinObjects.slice().sort((a,b)=>{ if(a.slot===b.slot) return a.idx-b.idx; return a.slot.localeCompare(b.slot); });
      sorted.forEach(sp=>{
        const row = document.createElement('div'); row.className='saved-pin-row';
        const cb = document.createElement('input'); cb.type='checkbox'; cb.checked = !!sp.selected; cb.dataset.slot = sp.slot; cb.dataset.idx = sp.idx;
        cb.addEventListener('change', (e)=>{ sp.selected = e.target.checked; updateSavedPinMarker(sp); });
        const nameInput = document.createElement('input'); nameInput.type='text'; nameInput.value = sp.name || `Pin ${sp.idx+1}`; nameInput.style.flex='1';
        nameInput.dataset.slot = sp.slot; nameInput.dataset.idx = sp.idx;
        nameInput.addEventListener('change', (e)=>{ sp.name = e.target.value; if(sp.marker) sp.marker.bindTooltip(sp.name, {permanent:false,direction:'top'}); });
        const badge = document.createElement('div'); badge.className='slot-badge'; badge.style.background = slotLoaded[sp.slot] ? slotLoaded[sp.slot].color : '#999';
        badge.textContent = sp.slot.replace('slot-','Slot ');
        row.appendChild(cb); row.appendChild(nameInput); row.appendChild(badge);
        savedPinsListEl.appendChild(row);
      });
    }

    function updateSavedPinMarker(sp){
      const color = slotLoaded[sp.slot] ? slotLoaded[sp.slot].color : '#2a6fdb';
      const fill = sp.selected ? color : '#999';
      const svg = `<svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 2 C9 7 6 9 6 13 A6 6 0 0 0 18 13 C18 9 15 7 12 2 Z" fill="${fill}"/></svg>`;
      if(sp.marker) sp.marker.setIcon(L.divIcon({ html: svg, className:'', iconSize:[18,18], iconAnchor:[9,18] }));
      const cb = document.querySelector(`#saved-pins-list input[data-slot="${sp.slot}"][data-idx="${sp.idx}"]`);
      if(cb) cb.checked = sp.selected;
    }

    function getSelectedSavedPinsInOrder(){ return savedPinObjects.filter(sp=>sp.selected).sort((a,b)=>{ if(a.slot===b.slot) return a.idx-b.idx; return a.slot.localeCompare(b.slot); }); }

    async function showRouteForSelectedPins(){
      const sel = getSelectedSavedPinsInOrder();
      if(!sel || sel.length < 2){ setStatus('選択された保存ピンを2つ以上選んでください'); return; }
      const coords = sel.map(s=>`${s.lng},${s.lat}`).join(';');
      try{
        setStatus('選択ピンの経路を取得中...');
        const data = await fetchRouteByCoords(coords);
        if(!data.routes || data.routes.length === 0){ setStatus('経路が見つかりません'); return; }
        const route = data.routes[0];
        if(polyline){ map.removeLayer(polyline); polyline=null; }
        clearArrows(); clearDirectionsPanel();
        polyline = L.geoJSON(route.geometry, { style:{ color:'#ff6600', weight:6, opacity:0.9 } }).addTo(map);
        map.fitBounds(polyline.getBounds().pad(0.1));
        addArrowsToRoute(route.geometry, 10);
        renderDirectionsPanel(route);
        setStatus('選択ピンでルート描画完了');
      }catch(e){ setStatus('OSRMエラー: ' + e.message); console.error(e); }
    }

    function clearSavedSelection(){ savedPinObjects.forEach(sp=>{ sp.selected=false; updateSavedPinMarker(sp); const cb = document.querySelector(`#saved-pins-list input[data-slot="${sp.slot}"][data-idx="${sp.idx}"]`); if(cb) cb.checked=false; }); setStatus('選択をクリアしました'); }

    /* quick load to editing markers (for editing) */
    async function loadRouteSingle(){
      try{
        const slot = document.getElementById('route-slot').value; const name='slot-'+slot;
        const res = await fetch('/load_route?name=' + encodeURIComponent(name)); if(!res.ok) throw new Error('HTTP ' + res.status);
        const j = await res.json();
        if(!j.points || j.points.length === 0){ setStatus('保存されたルートが見つかりません'); return; }
        if(!j.points.every(p=> p.lat>=KANAGAWA_BBOX.minLat && p.lat<=KANAGAWA_BBOX.maxLat && p.lng>=KANAGAWA_BBOX.minLng && p.lng<=KANAGAWA_BBOX.maxLng)){ setStatus('神奈川県外の点が含まれるため中止'); return; }
        clearMarkers(); j.points.forEach(p=> addMarker({lat:p.lat, lng:p.lng})); setStatus('スロット ' + name + ' を編集領域に読み込みました');
      }catch(e){ setStatus('読み込みエラー: ' + e.message); console.error(e); }
    }

    async function saveRoute(){
      syncPositionsFromMarkers();
      if(markerPositions.length === 0){ setStatus('保存するルートがありません'); return; }
      if(!markerPositions.every(p=> p.lat>=KANAGAWA_BBOX.minLat && p.lat<=KANAGAWA_BBOX.maxLat && p.lng>=KANAGAWA_BBOX.minLng && p.lng<=KANAGAWA_BBOX.maxLng)){ setStatus('神奈川県外の点が含まれるので保存不可'); return; }
      const slot = document.getElementById('route-slot').value; const name='slot-'+slot;
      const payload = { name:name, points: markerPositions, created_at: new Date().toISOString() };
      try{
        const res = await fetch('/save_route', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
        const j = await res.json();
        if(res.ok){ setStatus('保存しました: ' + name); await refreshSlotList(); } else { setStatus('保存失敗: ' + (j.error || res.statusText)); }
      }catch(e){ setStatus('保存エラー: ' + e.message); console.error(e); }
    }

    /* events */
    map.on('click', e=> addMarker(e.latlng));
    document.getElementById('btn-clear').addEventListener('click', clearMarkers);
    document.getElementById('btn-draw').addEventListener('click', drawRouting);
    document.getElementById('btn-save').addEventListener('click', saveRoute);
    document.getElementById('btn-load').addEventListener('click', loadRouteSingle);
    document.getElementById('btn-overwrite').addEventListener('click', ()=>{ if(confirm('選択中のスロットを上書きしてよいですか？')) saveRoute(); });
    document.getElementById('btn-show-selected-route').addEventListener('click', showRouteForSelectedPins);
    document.getElementById('btn-clear-selection').addEventListener('click', clearSavedSelection);

    /* ================= Address search using Nominatim (free) =================
       - Debounced search (avoid too many requests)
       - Click a result to place a marker (and optionally add to savedPinObjects)
       - Nominatim usage: respect rate limits; do not bulk-query.
    ------------------------------------------------------------------------- */
    let searchTimeout = null;
    searchInput.addEventListener('input', (e) => {
      const v = e.target.value.trim();
      if(searchTimeout) clearTimeout(searchTimeout);
      if(v.length < 3){ searchResultsEl.style.display='none'; return; }
      // debounce 500ms
      searchTimeout = setTimeout(()=> performAddressSearch(v), 500);
    });

    async function performAddressSearch(query){
      try{
        setStatus('住所検索中...');
        // Nominatim public API (free) - limited usage
        const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=8&q=' + encodeURIComponent(query) + '&countrycodes=jp';
        // include &accept-language=ja if needed
        const res = await fetch(url, { headers: { 'Accept-Language': 'ja' }});
        if(!res.ok){ setStatus('検索エラー: ' + res.status); return; }
        const arr = await res.json();
        searchResultsEl.innerHTML = '';
        if(!arr || arr.length === 0){ searchResultsEl.style.display='none'; setStatus('検索結果なし'); return; }
        arr.forEach(item=>{
          const el = document.createElement('div'); el.className='search-item';
          el.textContent = item.display_name;
          el.addEventListener('click', ()=> {
            // on click: place marker at lat/lon and center map
            const lat = parseFloat(item.lat), lon = parseFloat(item.lon);
            // clamp to kanagawa if outside
            const latlng = isInsideKanagawa({lat:lat,lng:lon}) ? L.latLng(lat,lon) : clampToKanagawa({lat:lat,lng:lon});
            const m = addMarker(latlng, { title: item.display_name });
            if(m){
              // optional: add to savedPinObjects as temporary (not auto-saved to slot)
              // just show tooltip and select marker for immediate inclusion
              m.bindPopup(item.display_name).openPopup();
            }
            searchResultsEl.style.display='none';
            searchInput.value = item.display_name;
            setStatus('検索結果をマップに追加しました');
          });
          searchResultsEl.appendChild(el);
        });
        searchResultsEl.style.display='block';
        setStatus('検索結果を表示');
      }catch(e){ setStatus('検索エラー: '+e.message); console.error(e); }
    }

    // hide results if click outside
    document.addEventListener('click', (ev)=>{ if(!searchResultsEl.contains(ev.target) && ev.target !== searchInput){ searchResultsEl.style.display='none'; } });

    /* debug helper (console) */
    async function debugShowSelected(){
      try{
        if(typeof savedPinObjects==='undefined') { console.warn('savedPinObjects 未定義'); return; }
        const sel = savedPinObjects.filter(s=>s.selected);
        if(!sel || sel.length < 2){ console.warn('選択ピンが2つ以上必要', sel); return; }
        const coords = sel.map(s=>`${s.lng},${s.lat}`).join(';');
        console.log('debug coords:', coords);
        const url = 'https://router.project-osrm.org/route/v1/driving/' + coords + '?overview=full&geometries=geojson&steps=true';
        console.log('fetching', url);
        const res = await fetch(url); console.log('status', res.status);
        const txt = await res.text(); console.log('response head', txt.slice(0,1000));
      }catch(e){ console.error('debug error', e); }
    }

    // init
    refreshSlotList();
    map.fitBounds(kanagawaBounds);

  </script>
</body>
</html>
