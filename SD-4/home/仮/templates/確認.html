<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>地図システム</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    .modal-header,
.modal-footer {
    border: none !important;
}
  </style>
</head>

<body>
  <!-- ログアウトボタン -->
<button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#logoutModal">
  ログアウト
</button>

<!-- モーダル本体 -->
<div class="modal fade" id="logoutModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <h5 class="modal-body text-center">
        ログアウトしますか？
      </h5>

      <div class="modal-footer d-flex justify-content-center">
            <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">いいえ</button>
            <button id="logoutYes" class="btn btn-danger ms-2">はい</button>
        </div>
    </div>
  </div>
</div>


  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- 外部JS -->
  <script src="js/map.js"></script>

</body>
</html>
