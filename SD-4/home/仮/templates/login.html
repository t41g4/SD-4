<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>補充支援</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
      .login-container {
        max-width: 350px;
        margin: 50px auto;
      }
    </style>
  </head>

  <body>

    <!-- ヘッダー -->
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #fca5a5;">
        <div class="container-fluid">
          <a class="navbar-brand" href="/"><i class="bi bi-map"></i> 補充支援</a>

          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                  data-bs-target="#navbarMenu" aria-controls="navbarMenu" 
                  aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarMenu">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link" href="index.html">ルート管理 <i class="bi bi-geo-alt"></i></a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <form action="/login" method="POST">
        <div class="mb-3">
          <label for="username" class="form-label">ユーザー名</label>
          <input type="text" class="form-control" id="username" name="login_id" required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">パスワード</label>
          <input type="password" class="form-control" name="password" id="password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">ログイン</button>

        <!-- Flaskエラー表示 -->
        {% if error %}
        <div class="mt-3 text-danger text-center">
          {{ error }}
        </div>
        {% endif %}
      </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
