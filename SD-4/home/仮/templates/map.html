<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>地図システム</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet-extra-markers/1.2.1/css/leaflet.extra-markers.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    #map { height: 100vh; z-index: 1;}
     .menu-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 1000; /* 地図より前面に */
    }
    .mode-btn {
    position: absolute;
    top: 15px;
    right: 15px; /* ← 左上から右上に変更 */
    z-index: 1000;
  }
    .search-bar {
  position: absolute;
  top: 15px;
  left: 70px;   /* ← ハンバーガーの右側に配置 */
  width: 250px;
  z-index: 1000;
  border-radius: 8px;
  padding-left: 10px;
}
#menu .offcanvas-bottom-btn {
    position: absolute;
    bottom: 20px;   /* 下からの距離 */
    right: 20px;    /* 右からの距離 */
    z-index: 10;
}
.modal-header,
.modal-footer {
    border: none !important;
}
.routeGeneration-btn {
    position: absolute;
    bottom: 15px;  /* 画面下からの距離 */
    right: 15px;   /* 画面右からの距離 */
    z-index: 1000;
}
.currentLocationStartBtn {
    position: absolute;
    bottom: 60px;  /* 画面下からの距離 */
    right: 15px;   /* 画面右からの距離 */
    z-index: 1000;
}
/* ルートステップのカスタムスタイル */
  .dir-step {
    padding: 8px;
    border-radius: 8px;
    margin-bottom: 6px;
    background: #fff;
    border: 1px solid #eee;
    cursor: pointer;
  }
  /* Offcanvas パネル内を縦スクロール可能に */
#directionsPanel .offcanvas-body {
    max-height: 80vh;   /* 画面高さの80%以内に制限 */
    overflow-y: auto;   /* 縦スクロールを有効に */
}
#routeStatus {
    display: none;
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    z-index: 9999;
    transition: opacity 0.5s;
}
  </style>
</head>

<body>
  <div id="map"></div>
  <!--ボタン類-->
     <button class="btn btn-dark menu-btn" data-bs-toggle="offcanvas" data-bs-target="#menu">
    ☰
    </button>

    <input 
  type="text" 
  id="addressInput" 
  class="form-control search-bar" 
  placeholder="住所を検索（Enter）">
    <button id="modeToggleBtn" class="btn btn-primary mode-btn">
  🔵 通常モード
  </button>
  <button id="routeGenerationBtn" class="btn btn-primary routeGeneration-btn">
  ルート生成
  </button>
  <button id="currentLocationStartBtn" class="btn btn-primary currentLocationStartBtn">
  現在地をスタート地点にする
  </button>
    <!--ここまでボタン類-->
    <!-- メニュー本体（Offcanvas） -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="menu">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title">メニュー</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <p>ここに項目を追加できます。</p>
      <ul>
        <li>現在地に移動</li>
        <li>ルート検索</li>
        <li>設定</li>
      </ul>
      <button class="btn btn-primary offcanvas-bottom-btn" data-bs-toggle="modal" data-bs-target="#logoutModal">ログアウト</button>
    </div>
  </div>
  <!-- ここまでメニュー本体（Offcanvas） -->
  <!-- マーカー詳細登録パネル -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="markerDetailPanel">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title">マーカー詳細登録</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body">
    <form id="markerForm">
      <div class="mb-3">
        <label for="markerName" class="form-label">マーカー名</label>
        <input type="text" class="form-control" id="markerName" required>
      </div>
      <div class="mb-3">
        <label for="markerDate" class="form-label">登録日時</label>
        <input type="datetime-local" class="form-control" id="markerDate" required>
      </div>
      <div class="mb-3">
        <label for="markerPhoto" class="form-label">写真</label>
        <input type="file" class="form-control" id="markerPhoto" accept="image/*">
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">登録</button>
        <button type="button" id="deleteBtn" class="btn btn-danger">削除</button>
        <button type="button" class="btn btn-success" id="setStartBtn">スタート地点に設定</button>
        <button type="button" class="btn btn-success" id="setGoalBtn">ゴール地点に設定</button>
      </div>
    </form>
  </div>
</div>
<!-- ここまでマーカー詳細登録パネル -->
<!-- ログアウトモーダル本体 -->
<div class="modal fade" id="logoutModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <h5 class="modal-body text-center">
        ログアウトしますか？
      </h5>

      <div class="modal-footer d-flex justify-content-center">
            <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">いいえ</button>
            <button id="logoutYes" class="btn btn-danger ms-2">はい</button>
            <!-- ログアウト用js -->
            <script>
              document.getElementById("logoutYes").addEventListener("click", function() {
                  window.location.href = "/logout";
              });
             </script>
             <!-- ここまでログアウト用js -->
          </div>
    </div>
  </div>
</div>
<!-- ここまでログアウトモーダル本体 -->
 <!-- ルート情報パネル -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="directionsPanel">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title">経路情報</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body">
    <div id="dir-summary" class="mb-3">
      距離・時間などの概要がここに表示されます
    </div>
    <ul id="dir-steps" class="list-group">
      <!-- 各ステップをクリックで地図上ハイライト -->
    </ul>
  </div>
</div>
<div id="routeStatus" 
     style="position:absolute; top:70px; left:50%; transform:translateX(-50%);
            background:#fff; padding:6px 12px; border-radius:6px; z-index:1000;
            box-shadow:0 0 4px rgba(0,0,0,0.3);">
  ルート情報
</div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!--ExtraMarkers の CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-extra-markers/1.2.1/js/leaflet.extra-markers.min.js"></script>
  <!-- turf.js -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  <script>
  // Flask の session からユーザーIDを取得（整数として扱う）
  const CURRENT_USER_ID = {{ session['user_id'] | tojson }};
  console.log("CURRENT_USER_ID:", CURRENT_USER_ID);
</script>

  <!-- 外部JS -->
  <script src="{{ url_for('static', filename='js/map.js') }}"></script>
</body>
</html>
