<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Leaflet - 湘南台エリア限定</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
  <style>
    body { margin:0; font-family: system-ui, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; }
    #map { height: 80vh; width: 100%; }
    .controls { padding: 8px; }
    button { margin-right: 6px; }
    #status { margin-left: 8px; color: #333; }
  </style>
</head>
<body>
  <div class="controls">
    <button id="btn-clear">マーカーをクリア</button>
    <button id="btn-draw">経路を描画</button>
    <button id="btn-save">ルートを保存</button>
    <button id="btn-load">保存ルートを読み込み</button>
    <span id="status">湘南台エリア内のみ許可されています。クリックで追加してください。</span>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

  <script>
    // === 湘南台（概算）の bbox（外接矩形） ===
    // 中心参考: 湘南台駅 35.39639, 139.46667 (出典: Wikipedia / Navitime)
    // bbox は駅周辺をカバーする概算値（必要なら値を調整してください）
    const SHONANDAI_BBOX = {
      minLat: 35.3880,
      minLng: 139.4580,
      maxLat: 35.4050,
      maxLng: 139.4765
    };

    const shonandaiBounds = L.latLngBounds(
      [SHONANDAI_BBOX.minLat, SHONANDAI_BBOX.minLng],
      [SHONANDAI_BBOX.maxLat, SHONANDAI_BBOX.maxLng]
    );

    // 地図初期化（湘南台周辺にフィット）
    const map = L.map('map', {
      center: shonandaiBounds.getCenter(),
      zoom: 15,
      maxBounds: shonandaiBounds.pad(0.03), // 少し余白を持たせる
      maxBoundsViscosity: 1.0
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let markers = [];
    let markerPositions = [];
    let routingControl = null;
    let polyline = null;
    const statusEl = document.getElementById('status');
    function setStatus(msg) { statusEl.textContent = msg; }

    function isInsideShonandai(latlng) {
      return latlng.lat >= SHONANDAI_BBOX.minLat &&
             latlng.lat <= SHONANDAI_BBOX.maxLat &&
             latlng.lng >= SHONANDAI_BBOX.minLng &&
             latlng.lng <= SHONANDAI_BBOX.maxLng;
    }

    function clampToShonandai(latlng) {
      const lat = Math.max(SHONANDAI_BBOX.minLat, Math.min(SHONANDAI_BBOX.maxLat, latlng.lat));
      const lng = Math.max(SHONANDAI_BBOX.minLng, Math.min(SHONANDAI_BBOX.maxLng, latlng.lng));
      return L.latLng(lat, lng);
    }

    function addMarker(latlng) {
      if (!isInsideShonandai(latlng)) {
        setStatus('湘南台エリア外のため、マーカーは追加できません。');
        return;
      }
      const m = L.marker(latlng, { draggable: true }).addTo(map);
      m.on('dragend', () => {
        const p = m.getLatLng();
        if (!isInsideShonandai(p)) {
          m.setLatLng(clampToShonandai(p));
          setStatus('範囲外にドラッグされたため湘南台内に戻しました。');
        }
        syncPositionsFromMarkers();
        updatePolyline();
      });
      markers.push(m);
      markerPositions.push({ lat: latlng.lat, lng: latlng.lng });
      updatePolyline();
      setStatus(`マーカー数: ${markers.length}`);
    }

    function syncPositionsFromMarkers() {
      markerPositions = markers.map(m => {
        const p = m.getLatLng();
        return { lat: p.lat, lng: p.lng };
      });
    }

    function clearMarkers() {
      if (routingControl) { map.removeControl(routingControl); routingControl = null; }
      if (polyline) { map.removeLayer(polyline); polyline = null; }
      markers.forEach(m => map.removeLayer(m));
      markers = [];
      markerPositions = [];
      setStatus('マーカーをクリアしました。');
    }

    function updatePolyline() {
      syncPositionsFromMarkers();
      if (polyline) map.removeLayer(polyline);
      if (markerPositions.length >= 2) {
        const latlngs = markerPositions.map(p => [p.lat, p.lng]);
        polyline = L.polyline(latlngs, { weight: 4 }).addTo(map);
        map.fitBounds(polyline.getBounds().pad(0.05));
      }
    }

    function drawRouting() {
      if (markers.length < 2) { setStatus('マーカーは2つ以上必要です。'); return; }
      // 全点が湘南台内かチェック
      if (!markers.every(m => isInsideShonandai(m.getLatLng()))) {
        setStatus('ルート上の全ウェイポイントは湘南台エリア内である必要があります。');
        return;
      }
      if (routingControl) { map.removeControl(routingControl); routingControl = null; }
      const waypoints = markers.map(m => m.getLatLng());
      routingControl = L.Routing.control({
        waypoints: waypoints,
        router: L.Routing.osrmv1(),
        show: true,
        addWaypoints: false,
        routeWhileDragging: true
      }).addTo(map);
      setStatus('経路を描画しました（OSRMデモサーバ）。');
    }

    async function saveRoute() {
      syncPositionsFromMarkers();
      if (markerPositions.length === 0) { setStatus('保存するルートがありません。'); return; }
      // サーバ側でも必ず検証してください（こちらはフロント側チェック）
      if (!markerPositions.every(p =>
        p.lat >= SHONANDAI_BBOX.minLat && p.lat <= SHONANDAI_BBOX.maxLat &&
        p.lng >= SHONANDAI_BBOX.minLng && p.lng <= SHONANDAI_BBOX.maxLng)) {
        setStatus('保存できません：ルートに湘南台外の点が含まれています。');
        return;
      }
      const payload = { name: 'shonandai-route', points: markerPositions, created_at: new Date().toISOString() };
      try {
        const res = await fetch('/save_route', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
        });
        const j = await res.json();
        if (res.ok) setStatus('ルートをサーバに保存しました。');
        else setStatus('保存に失敗: ' + (j.error || res.statusText));
      } catch (err) { setStatus('保存でエラー: ' + err.message); }
    }

    async function loadRoute() {
      try {
        const res = await fetch('/load_route?name=shonandai-route');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const j = await res.json();
        if (!j.points || j.points.length === 0) { setStatus('保存されたルートが見つかりません。'); return; }
        if (!j.points.every(p =>
          p.lat >= SHONANDAI_BBOX.minLat && p.lat <= SHONANDAI_BBOX.maxLat &&
          p.lng >= SHONANDAI_BBOX.minLng && p.lng <= SHONANDAI_BBOX.maxLng)) {
          setStatus('読み込んだルートに湘南台外の点が含まれているため中止しました。');
          return;
        }
        clearMarkers();
        j.points.forEach(p => addMarker({ lat: p.lat, lng: p.lng }));
        updatePolyline();
        drawRouting();
        setStatus('ルートを読み込みました。');
      } catch (err) { setStatus('読み込みでエラー: ' + err.message); }
    }

    // クリックで追加（範囲外は拒否）
    map.on('click', e => addMarker(e.latlng));

    document.getElementById('btn-clear').addEventListener('click', clearMarkers);
    document.getElementById('btn-draw').addEventListener('click', drawRouting);
    document.getElementById('btn-save').addEventListener('click', saveRoute);
    document.getElementById('btn-load').addEventListener('click', loadRoute);

    // 初期表示を湘南台にフィット
    map.fitBounds(shonandaiBounds);
  </script>
</body>
</html>
